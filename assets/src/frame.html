<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#0B101E}
body{font-family:Inter,system-ui,sans-serif;color:#EEF1F8;overflow:hidden}

/* Type is written in DISPLAYED pixels and multiplied by --k, the downscale
   factor of this canvas, so every graphic reads at the same size on the
   page whether it lands in a 518px slot or a 1136px band. */
#stage{position:relative;overflow:hidden;background:#0B101E}
.pad{position:absolute;inset:0;padding:calc(20px * var(--k)) calc(22px * var(--k));display:flex;flex-direction:column}

.t-ttl{font-size:calc(15px * var(--k));font-weight:600;letter-spacing:-.02em;color:#EEF1F8}
.t-sub{font-size:calc(10px * var(--k));color:#616C84;margin-top:calc(2px * var(--k))}
.t-lbl{font-size:calc(10.5px * var(--k));font-weight:500;color:#98A2B8}
.t-mut{font-size:calc(8.5px * var(--k));color:#616C84}
.t-big{font-size:calc(26px * var(--k));font-weight:700;letter-spacing:-.03em;line-height:1;color:#EEF1F8}
.t-mid{font-size:calc(19px * var(--k));font-weight:700;letter-spacing:-.03em;line-height:1;color:#EEF1F8}
.t-eyb{font-size:calc(8.5px * var(--k));letter-spacing:.14em;color:#616C84}

.card{background:rgba(255,255,255,.030);border:1px solid rgba(255,255,255,.070);
      border-radius:calc(7px * var(--k))}
.chip{display:flex;align-items:center;gap:calc(5px * var(--k));
      background:rgba(255,255,255,.030);border:1px solid rgba(255,255,255,.070);
      border-radius:calc(5px * var(--k));padding:calc(6px * var(--k)) calc(9px * var(--k))}
.dot{width:calc(5.5px * var(--k));height:calc(5.5px * var(--k));border-radius:50%;flex:none}
.hd{display:flex;align-items:flex-start;justify-content:space-between;
    margin-bottom:calc(11px * var(--k));flex:none}
svg{display:block}
</style></head>
<body>
<div id="stage"><div class="pad" id="pad"></div></div>

<script type="module">
const BLUE='#3B82F6', AMBER='#C9820A', VIOLET='#A971F7', RED='#F0435C';
/* Teal is only used where three series must be told apart at once. Blue+violet
   fails the validator all-pairs at deltaE 0.6 under protanopia; blue/amber/teal
   clears at 16.0. */
const TEAL='#0EA5A5';
const INK='#EEF1F8', INK3='#616C84';
const LINE='rgba(255,255,255,.070)', LINE2='rgba(255,255,255,.140)', GRID='rgba(255,255,255,.055)';
const BG='#0B101E', NS='http://www.w3.org/2000/svg';

const WIDE={w:2272,h:900,k:2.00};    // displays at 1136 wide
const TALL={w:1536,h:1000,k:2.97};   // displays at  518 wide
const id=+(location.hash.slice(1)||1);
const PORT={w:1000,h:1280,k:2.04};   // displays at  490 wide (contact, 4:5)
const SEC={w:1200,h:856,k:2.87};     // displays at  418 wide (product security, 4:3)
const SPEC=({1:WIDE,9:WIDE,11:WIDE,12:PORT,21:SEC})[id]||TALL;
const stage=document.getElementById('stage'), pad=document.getElementById('pad');
stage.style.width=SPEC.w+'px'; stage.style.height=SPEC.h+'px';
document.body.style.width=SPEC.w+'px'; document.body.style.height=SPEC.h+'px';
document.documentElement.style.setProperty('--k',SPEC.k);
const K=SPEC.k, px=v=>v*K;

/* Nothing may measure until the webfont has landed. With @import the font
   arrives after first layout, so the header height - and every fit() under it -
   differed from render to render. That non-determinism is how a broken frame
   shipped after a good one was reviewed. */
await document.fonts.ready;

/* fit() measures the box FIRST so one viewBox unit is one CSS pixel. That is
   what lets absolutely positioned HTML labels land exactly on the shapes the
   SVG draws — the earlier version let the SVG letterbox and everything slid. */
function fit(box){
  const r=box.getBoundingClientRect(), W=Math.round(r.width), H=Math.round(r.height);
  const s=document.createElementNS(NS,'svg');
  s.setAttribute('viewBox',`0 0 ${W} ${H}`);
  s.setAttribute('width',W); s.setAttribute('height',H);
  s.style.cssText='position:absolute;left:0;top:0';
  box.appendChild(s);
  return {s,W,H};
}
function over(box,x,y,w,h,html,extra){
  const d=document.createElement('div');
  d.style.cssText=`position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${h}px;`+(extra||'');
  d.innerHTML=html; box.appendChild(d); return d;
}
function el(n,a){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e;}
function pts(vals,W,H,padT,padB,padR){
  padR=padR||0;const lo=Math.min(...vals),hi=Math.max(...vals),sp=(hi-lo)||1,ih=H-padT-padB,iw=W-padR;
  return vals.map((v,i)=>[(i/(vals.length-1))*iw, padT+ih-((v-lo)/sp)*ih]);
}
const dOf=P=>P.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
function endDot(s,P,col,r){r=r||px(4.5);const l=P[P.length-1];
  s.appendChild(el('circle',{cx:l[0],cy:l[1],r:r*1.55,fill:BG}));
  s.appendChild(el('circle',{cx:l[0],cy:l[1],r:r,fill:col}));}
function head(t,sub,right,rsub){
  const h=document.createElement('div'); h.className='hd';
  h.innerHTML=`<div><div class="t-ttl">${t}</div>${sub?`<div class="t-sub">${sub}</div>`:''}</div>`+
   (right?`<div style="text-align:right"><div class="t-big">${right}</div>${rsub?`<div class="t-sub">${rsub}</div>`:''}</div>`:'');
  pad.appendChild(h); return h;
}
function plot(flex,mt){const d=document.createElement('div');
  d.style.cssText=`flex:${flex||'1 1 auto'};min-height:0;position:relative;${mt?`margin-top:${px(mt)}px`:''}`;
  pad.appendChild(d); return d;}

/* ══ 1 — scattered inputs resolving into one decision  (WIDE) ═════════ */
function g1(){
  const box=plot(); const {s,W,H}=fit(box);
  const cols=[BLUE,VIOLET,AMBER,RED];
  const tx=W*0.775, ty=H*0.5, cw=px(96), ch=px(44);
  let seed=11; const rnd=()=>((seed=seed*16807%2147483647)/2147483647);
  const nodes=[];
  for(let i=0;i<80;i++) nodes.push({x:px(6)+rnd()*(W*0.46), y:px(4)+rnd()*(H-px(8)),
    r:px(1.4)+rnd()*px(3.2), c:cols[Math.floor(rnd()*4)]});
  nodes.forEach(n=>{
    const mx=n.x+(tx-n.x)*0.62, my=n.y+(ty-n.y)*0.62;
    s.appendChild(el('path',{d:`M${n.x},${n.y} Q${mx},${my} ${tx-cw-px(6)},${ty+(n.y-ty)*0.12}`,
      stroke:'rgba(255,255,255,.055)','stroke-width':px(.8),fill:'none'}));
  });
  nodes.forEach(n=>{
    s.appendChild(el('circle',{cx:n.x,cy:n.y,r:n.r*1.6,fill:BG}));
    s.appendChild(el('circle',{cx:n.x,cy:n.y,r:n.r,fill:'none',stroke:n.c,'stroke-width':px(1.3),opacity:.85}));
  });
  s.appendChild(el('ellipse',{cx:tx,cy:ty,rx:cw*1.85,ry:ch*2.35,fill:'none',stroke:'rgba(59,130,246,.16)','stroke-width':px(1.4)}));
  s.appendChild(el('ellipse',{cx:tx,cy:ty,rx:cw*1.42,ry:ch*1.75,fill:'none',stroke:'rgba(59,130,246,.30)','stroke-width':px(1.4)}));
  s.appendChild(el('rect',{x:tx-cw,y:ty-ch,width:cw*2,height:ch*2,rx:px(10),fill:'#101A30',stroke:BLUE,'stroke-width':px(1.5)}));
  over(box,tx-cw,ty-ch,cw*2,ch*2,
    `<div class="t-mid">One decision</div>`,
    `display:flex;align-items:center;justify-content:center`);
}

/* ══ 2 — the page's own list of inputs, converging ═══════════════════ */
function g2(){
  head('Every input, one place','the inputs this page names');
  const box=plot(); const {s,W,H}=fit(box);
  const items=['Sales','Advertising','Inventory','Costs','Fees','Cash flow','Suppliers','Forecasts'];
  const cols=[BLUE,VIOLET,AMBER,RED,BLUE,VIOLET,AMBER,RED];
  const cw=W*0.40, rh=px(26), gap=(H-items.length*rh)/(items.length-1);
  const tx=W-px(50), ty=H/2, rr=px(34);
  items.forEach((t,i)=>{
    const y=i*(rh+gap)+rh/2;
    s.appendChild(el('path',{d:`M${cw},${y} C${cw+px(50)},${y} ${tx-rr-px(70)},${ty} ${tx-rr-px(4)},${ty}`,
      stroke:'rgba(255,255,255,.11)','stroke-width':px(1.1),fill:'none'}));
  });
  items.forEach((t,i)=>{
    const y=i*(rh+gap);
    over(box,0,y,cw,rh,
      `<span class="dot" style="background:${cols[i]}"></span><span class="t-lbl">${t}</span>`,
      `display:flex;align-items:center;gap:${px(5)}px;background:rgba(255,255,255,.030);
       border:1px solid ${LINE};border-radius:${px(5)}px;padding:0 ${px(9)}px`);
  });
  s.appendChild(el('circle',{cx:tx,cy:ty,r:rr*1.45,fill:'none',stroke:'rgba(59,130,246,.22)','stroke-width':px(1.4)}));
  s.appendChild(el('circle',{cx:tx,cy:ty,r:rr,fill:'#101A30',stroke:BLUE,'stroke-width':px(1.5)}));
  over(box,tx-rr,ty-rr,rr*2,rr*2,`<div class="t-lbl" style="color:${INK};text-align:center">Decision</div>`,
    `display:flex;align-items:center;justify-content:center`);
}

/* ══ 3 — a healthy headline, three series that disagree ══════════════ */
function g3(){
  head('Revenue','Trailing 24 months','+64%','24-month change');
  const box=plot('1 1 auto');
  const row=document.createElement('div');
  row.style.cssText=`display:grid;grid-template-columns:repeat(3,1fr);gap:${px(11)}px;
    height:${px(112)}px;flex:none;margin-top:${px(13)}px`;
  pad.appendChild(row);          // appended first: fit() must measure the FINAL box
  const {s,W,H}=fit(box);
  const REV=[100,101,99,104,106,105,110,113,112,118,121,120,126,129,133,131,138,142,140,147,152,155,159,164];
  for(let i=1;i<=3;i++){const y=(H-px(9))*(i/4)+px(2);
    s.appendChild(el('line',{x1:0,x2:W,y1:y,y2:y,stroke:GRID,'stroke-width':px(.7)}));}
  s.appendChild(el('line',{x1:0,x2:W,y1:H-px(4),y2:H-px(4),stroke:LINE2,'stroke-width':px(.7)}));
  const P=pts(REV,W,H,px(6),px(9),px(6));
  const g=el('linearGradient',{id:'ga',x1:0,y1:0,x2:0,y2:1});
  g.innerHTML='<stop offset="0" stop-color="#3B82F6" stop-opacity=".26"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>';
  s.appendChild(g);
  s.appendChild(el('path',{d:dOf(P)+` L${P[P.length-1][0]},${H-px(4)} L0,${H-px(4)} Z`,fill:'url(#ga)'}));
  s.appendChild(el('path',{d:dOf(P),fill:'none',stroke:BLUE,'stroke-width':px(2.2),'stroke-linecap':'round','stroke-linejoin':'round'}));
  endDot(s,P,BLUE);

  [['Gross margin','31%','22%',AMBER,'↓',[31,31,30,30,30,29,29,29,28,28,27,27,27,26,26,25,25,24,24,23,23,23,22,22],'percent of revenue'],
   ['Stock cover','9.4w','3.1w',VIOLET,'↓',[9.4,9.3,9.1,8.8,8.6,8.1,7.9,7.4,7.2,6.8,6.5,6.1,5.9,5.5,5.2,4.9,4.6,4.3,4.1,3.9,3.6,3.4,3.2,3.1],'weeks of cover'],
   ['Ad spend / revenue','11%','24%',RED,'↑',[11,11,12,12,13,13,14,14,15,16,16,17,17,18,19,19,20,21,21,22,22,23,23,24],'percent of revenue']
  ].forEach(([t,fr,to,col,gl,data,foot])=>{
    const c=document.createElement('div'); c.className='card';
    c.style.cssText+=`padding:${px(9)}px ${px(10)}px ${px(7)}px;display:flex;flex-direction:column`;
    c.innerHTML=`<div class="t-lbl">${t}</div>
      <div style="display:flex;align-items:baseline;gap:${px(5)}px;margin:${px(5)}px 0 ${px(2)}px">
        <span class="t-mut" style="text-decoration:line-through">${fr}</span>
        <span class="t-mid">${to}</span>
        <span style="color:${col};font-size:${px(11)}px;font-weight:700">${gl}</span></div>
      <div style="flex:1 1 auto;min-height:0;position:relative"></div>
      <div class="t-mut" style="margin-top:${px(4)}px">${foot}</div>`;
    row.appendChild(c);
    const {s:ss,W:w2,H:h2}=fit(c.children[2]);
    const PP=pts(data,w2,h2,px(4),px(4),px(4));
    ss.appendChild(el('path',{d:dOf(PP),fill:'none',stroke:col,'stroke-width':px(1.8),'stroke-linecap':'round','stroke-linejoin':'round'}));
    endDot(ss,PP,col,px(3.4));
  });
}

/* ══ 4 — one clean answer above, the machinery below ═════════════════ */
function g4(){
  const card=document.createElement('div'); card.className='card';
  card.style.cssText+=`flex:none;padding:${px(15)}px ${px(16)}px;
    border-color:rgba(59,130,246,.42);background:rgba(59,130,246,.07)`;
  card.innerHTML=`<div class="t-eyb" style="color:${BLUE}">THE ANSWER</div>
    <div class="t-ttl" style="margin-top:${px(6)}px">Reorder SKU A-1140 this week</div>
    <div class="t-sub" style="margin-top:${px(5)}px">Cover falls below lead time on day 19</div>`;
  pad.appendChild(card);

  const wl=document.createElement('div');
  wl.style.cssText=`flex:none;display:flex;align-items:center;gap:${px(9)}px;margin:${px(16)}px 0 ${px(13)}px`;
  wl.innerHTML=`<div style="height:1px;flex:1;background:${LINE2}"></div>
    <div class="t-eyb" style="white-space:nowrap">EVERYTHING UNDERNEATH IT</div>
    <div style="height:1px;flex:1;background:${LINE2}"></div>`;
  pad.appendChild(wl);

  const grid=document.createElement('div');
  grid.style.cssText=`flex:1 1 auto;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);
    grid-auto-rows:1fr;column-gap:${px(12)}px;opacity:.55;overflow:hidden`;
  pad.appendChild(grid);
  ['velocity 7d / 28d','seasonal index','lead time p80','freight in transit','safety stock','open POs',
   'return rate','fee schedule','landed unit cost','FX on supplier','storage tier','ad-driven units',
   'organic units','stockout risk','margin after fees','cash conversion','reorder point','supplier MOQ',
   'shelf-life cap','competitor price','buy-box share','forecast error','promo lift','warehouse cap',
   'refund lag','coupon burn','inbound defects','replen cadence','tier breakpoints','net terms'
  ].forEach((r,i)=>{
    const d=document.createElement('div');
    d.style.cssText=`display:flex;align-items:center;gap:${px(5)}px;min-width:0`;
    d.innerHTML=`<span style="width:${px(3.6)}px;height:${px(3.6)}px;border-radius:50%;
      background:${[BLUE,VIOLET,AMBER,RED][i%4]};opacity:.8;flex:none"></span>
      <span class="t-mut" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${r}</span>`;
    grid.appendChild(d);
  });
}

/* ══ 5 — what is missing, and what it would unlock ═══════════════════ */
function g5(){
  head('Inputs connected','','4 of 6','');
  const bar=document.createElement('div');
  bar.style.cssText=`flex:none;height:${px(8)}px;display:flex;gap:${px(2)}px;margin-bottom:${px(14)}px`;
  for(let i=0;i<6;i++){const g=document.createElement('div');
    g.style.cssText=`flex:1;border-radius:${px(4)}px;background:${i<4?BLUE:'rgba(255,255,255,.09)'}`;
    bar.appendChild(g);}
  pad.appendChild(bar);

  const list=document.createElement('div');
  list.style.cssText=`flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:${px(6)}px`;
  pad.appendChild(list);
  [['Orders',1],['Advertising',1],['Inventory',1],['Fees',1],['Supplier costs',0],['Freight',0]]
  .forEach(([t,ok])=>{
    const r=document.createElement('div'); r.className='card';
    r.style.cssText+=`flex:1 1 0;min-height:0;display:flex;align-items:center;gap:${px(9)}px;
      padding:0 ${px(12)}px;${ok?'':'border-color:rgba(201,130,10,.45);background:rgba(201,130,10,.06)'}`;
    r.innerHTML=`<span style="color:${ok?BLUE:AMBER};font-size:${px(11)}px;font-weight:700;width:${px(12)}px">${ok?'✓':'!'}</span>
      <span class="t-lbl" style="flex:1">${t}</span>
      <span class="t-mut">${ok?'connected':'missing'}</span>`;
    list.appendChild(r);
  });

  const unlock=document.createElement('div'); unlock.className='card';
  unlock.style.cssText+=`flex:none;margin-top:${px(12)}px;padding:${px(11)}px ${px(13)}px;
    border-color:rgba(201,130,10,.45)`;
  unlock.innerHTML=`<div class="t-eyb" style="color:${AMBER}">WHAT THE MISSING TWO WOULD UNLOCK</div>
    <div class="t-lbl" style="color:${INK};margin-top:${px(5)}px">True landed margin per SKU</div>`;
  pad.appendChild(unlock);
}

/* ══ 6 — narrowing to the handful worth opening today ════════════════ */
function g6(){
  head('Narrowing the field','every SKU and campaign, down to today');
  const box=plot(); const {s,W,H}=fit(box);
  const steps=[['Everything','1,284',1.00,BLUE],['Unusual','206',0.74,VIOLET],
               ['Explained','61',0.58,AMBER],['Worth opening today','7',0.44,RED]];
  const bh=H*0.175, gapY=(H-steps.length*bh)/(steps.length-1);
  steps.forEach(([t,n,f,c],i)=>{
    const y=i*(bh+gapY), w=W*f, x=(W-w)/2;
    if(i<steps.length-1){
      const nw=W*steps[i+1][2], nx=(W-nw)/2;
      s.appendChild(el('path',{d:`M${x+px(6)},${y+bh} L${nx+px(6)},${y+bh+gapY}`,stroke:LINE,'stroke-width':px(.8)}));
      s.appendChild(el('path',{d:`M${x+w-px(6)},${y+bh} L${nx+nw-px(6)},${y+bh+gapY}`,stroke:LINE,'stroke-width':px(.8)}));
    }
    s.appendChild(el('rect',{x,y,width:w,height:bh,rx:px(7),fill:'rgba(255,255,255,.030)',stroke:LINE,'stroke-width':px(.7)}));
    s.appendChild(el('rect',{x,y,width:px(2.6),height:bh,rx:px(1.3),fill:c}));
    over(box,x,y,w,bh,
      `<span class="t-lbl" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${t}</span>
       <span class="t-mid" style="flex:none">${n}</span>`,
      `display:flex;align-items:center;justify-content:space-between;
       padding:0 ${px(12)}px 0 ${px(13)}px;gap:${px(8)}px`);
  });
}

/* ══ 7 — your trajectory against comparable sellers ══════════════════ */
function g7(){
  head('Your trajectory','against comparable sellers');
  const box=plot();
  const lg=document.createElement('div');
  lg.style.cssText=`flex:none;display:flex;gap:${px(18)}px;margin-top:${px(12)}px`;
  lg.innerHTML=`<span style="display:flex;align-items:center;gap:${px(6)}px">
      <span class="dot" style="background:${BLUE}"></span><span class="t-mut">You</span></span>
    <span style="display:flex;align-items:center;gap:${px(6)}px">
      <span style="width:${px(12)}px;height:${px(5.5)}px;border-radius:${px(2)}px;background:rgba(169,113,247,.42)"></span>
      <span class="t-mut">Comparable sellers, middle range</span></span>`;
  pad.appendChild(lg);
  const {s,W,H}=fit(box);
  const hi=[58,59,58,61,63,62,65,67,68,67,70,72,73,74,76,77,79,80,82,84],
        lo=[42,43,41,44,46,45,47,49,48,50,52,51,54,55,54,56,58,57,59,61],
        me=[47,49,48,53,56,54,60,64,63,69,73,71,78,83,81,88,93,91,99,107];
  const all=[...hi,...lo,...me], mn=Math.min(...all), mx=Math.max(...all);
  const Y=v=>px(8)+(H-px(20))*(1-(v-mn)/(mx-mn)), X=i=>(i/(hi.length-1))*(W-px(6));
  for(let i=1;i<=3;i++){const y=(H-px(10))*(i/4)+px(3);
    s.appendChild(el('line',{x1:0,x2:W,y1:y,y2:y,stroke:GRID,'stroke-width':px(.7)}));}
  const band=hi.map((v,i)=>`${i?'L':'M'}${X(i)},${Y(v)}`).join(' ')+' '+
             lo.slice().reverse().map((v,i)=>`L${X(lo.length-1-i)},${Y(v)}`).join(' ')+' Z';
  s.appendChild(el('path',{d:band,fill:'rgba(169,113,247,.11)'}));
  [hi,lo].forEach(a=>s.appendChild(el('path',{d:a.map((v,i)=>`${i?'L':'M'}${X(i)},${Y(v)}`).join(' '),
    fill:'none',stroke:'rgba(169,113,247,.55)','stroke-width':px(1.1),'stroke-dasharray':`${px(4)} ${px(3)}`})));
  const P=me.map((v,i)=>[X(i),Y(v)]);
  s.appendChild(el('path',{d:dOf(P),fill:'none',stroke:BLUE,'stroke-width':px(2.2),'stroke-linecap':'round','stroke-linejoin':'round'}));
  endDot(s,P,BLUE);
}

/* ══ 8 — feedback becoming a change ══════════════════════════════════ */
function g8(){
  head('Shaped by sellers','what we heard, and what changed');
  const wrap=document.createElement('div');
  wrap.style.cssText=`flex:1 1 auto;min-height:0;display:grid;
    grid-template-columns:1fr ${px(24)}px 1fr;gap:${px(10)}px;align-items:stretch`;
  pad.appendChild(wrap);

/* ══ 9 — the six stages as a closed loop  (WIDE) ═════════════════════ */
function g9(){
  const box=plot(); const {s,W,H}=fit(box);
  const stages=[['Data','What happened?',BLUE],['Context','Why might it have happened?',BLUE],
                ['Analysis','What matters?',VIOLET],['Focus','What deserves attention?',VIOLET],
                ['Action','What should you do next?',AMBER],['Learning','What happened as a result?',AMBER]];
  const cw=px(96), ch=px(40);
  const cx=W/2, cy=H/2, rx=W/2-cw-px(6), ry=H/2-ch-px(4);
  s.appendChild(el('ellipse',{cx,cy,rx,ry,fill:'none',stroke:LINE,'stroke-width':px(1.2)}));
  const A=i=>-Math.PI/2+i*(Math.PI*2/6);
  const pos=stages.map((_,i)=>[cx+rx*Math.cos(A(i)), cy+ry*Math.sin(A(i))]);
  pos.forEach((p,i)=>{
    const a0=A(i+0.5), mx=cx+rx*Math.cos(a0), my=cy+ry*Math.sin(a0);
    const q=pos[(i+1)%6], ang=Math.atan2(q[1]-p[1],q[0]-p[0])*180/Math.PI;
    const col=i===5?AMBER:'rgba(255,255,255,.32)', t=px(5);
    s.appendChild(el('path',{d:`M${-t},${-t*0.85} L${t},0 L${-t},${t*0.85} Z`,fill:col,
      transform:`translate(${mx},${my}) rotate(${ang})`}));
  });
  pos.forEach((p,i)=>{
    const [t,q]=stages[i];
    s.appendChild(el('rect',{x:p[0]-cw,y:p[1]-ch,width:cw*2,height:ch*2,rx:px(9),
      fill:'#0E1424',stroke:i===5?AMBER:LINE,'stroke-width':px(i===5?1.5:1)}));
    over(box,p[0]-cw,p[1]-ch,cw*2,ch*2,
      `<div class="t-lbl" style="color:${INK};font-weight:600">${t}</div>
       <div class="t-mut" style="margin-top:${px(3)}px;line-height:1.35">${q}</div>`,
      `display:flex;flex-direction:column;align-items:center;justify-content:center;
       text-align:center;padding:0 ${px(8)}px`);
  });
  over(box,cx-px(120),cy-px(8),px(240),px(16),
    `<div class="t-eyb" style="color:${AMBER}">LEARNING FEEDS BACK INTO DATA</div>`,
    `display:flex;align-items:center;justify-content:center`);
}

               'Learn from your own history','Learn from other sellers','Decide with less wasted effort'];
  const cols=[BLUE,BLUE,VIOLET,VIOLET,AMBER];

    s.appendChild(el('line',{x1:0,x2:W,y1:y,y2:y,stroke:'rgba(255,255,255,.045)','stroke-width':px(.7)}));

/* ══ 14 — Financials: revenue down to net profit ═════════════════════ */
function g14(){
  head('From revenue to net profit','one month, one SKU');
  const box=plot(); const {s,W,H}=fit(box);
  const steps=[['Revenue',48200,BLUE,1],['Amazon fees',-13100,RED,0],['Cost of goods',-16400,RED,0],
               ['Advertising',-7300,RED,0],['Refunds',-1900,RED,0],['Overheads',-2600,RED,0],
               ['Net profit',6900,BLUE,1]];
  const top=48200, base=H-px(30), scale=(base-px(6))/top;
  const bw=W/steps.length*0.62, gap=W/steps.length;
  let run=0;
  steps.forEach(([t,v,c,isTotal],i)=>{
    const x=gap*i+(gap-bw)/2;
    let y0,y1;
    if(isTotal){ y0=base; y1=base-Math.abs(v)*scale; }
    else { y0=base-run*scale; y1=base-(run+v)*scale; }
    const yTop=Math.min(y0,y1), h=Math.max(Math.abs(y1-y0),px(1.5));
    s.appendChild(el('rect',{x,y:yTop,width:bw,height:h,rx:px(2.5),fill:c,opacity:isTotal?.95:.75}));
    if(!isTotal) run+=v; else run=v;
    if(i<steps.length-1&&!isTotal){
      const yc=base-run*scale;
      s.appendChild(el('line',{x1:x+bw,x2:gap*(i+1)+(gap-bw)/2,y1:yc,y2:yc,
        stroke:'rgba(255,255,255,.20)','stroke-width':px(.7),'stroke-dasharray':`${px(2.5)} ${px(2.5)}`}));
    }
    over(box,gap*i,yTop-px(15),gap,px(12),
      `<div class="t-mut" style="text-align:center;white-space:nowrap">${v<0?'−':''}$${Math.abs(v/1000).toFixed(1)}k</div>`);
    over(box,gap*i,base+px(7),gap,px(24),
      `<div class="t-mut" style="text-align:center;line-height:1.3">${t}</div>`);
  });
  s.appendChild(el('line',{x1:0,x2:W,y1:base,y2:base,stroke:LINE2,'stroke-width':px(.8)}));
}

/* Guard: no SVG may exceed the box it was fitted to. This is the exact failure
   that shipped - a stale measurement leaving the chart drawn over its siblings. */
const spill=[...document.querySelectorAll('svg')].filter(sv=>{
  const p=sv.parentElement; if(!p) return false;
  const a=sv.getBoundingClientRect(), b=p.getBoundingClientRect();
  return a.height>b.height+1 || a.width>b.width+1 || a.bottom>b.bottom+1;
}).map(sv=>{const a=sv.getBoundingClientRect(),b=sv.parentElement.getBoundingClientRect();
  return `svg ${Math.round(a.width)}x${Math.round(a.height)} in box ${Math.round(b.width)}x${Math.round(b.height)}`;});
if(spill.length) document.body.dataset.spill=JSON.stringify(spill);
document.body.dataset.ready='1';
